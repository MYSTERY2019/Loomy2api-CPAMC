name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: loomy

jobs:
  darwin:
    # 一台 Apple Silicon 机器同时产出 arm64 与 amd64（clang 可跨架构，SDK 是通用的）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Build both darwin arches
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          mkdir -p ../dist ../out
          VER="${GITHUB_REF_NAME#v}"; [ -n "$VER" ] || VER="0.0.0-dev"

          cat > ../cc-arm64 <<'EOF'
          #!/bin/sh
          exec clang -arch arm64 "$@"
          EOF
          cat > ../cc-amd64 <<'EOF'
          #!/bin/sh
          exec clang -arch x86_64 "$@"
          EOF
          chmod +x ../cc-arm64 ../cc-amd64

          for arch in arm64 amd64; do
            CC="$PWD/../cc-$arch" CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -buildmode=c-shared -o ../dist/loomy.dylib .
            file ../dist/loomy.dylib
            lipo -info ../dist/loomy.dylib || true
            NAME="${PLUGIN_ID}_${VER}_darwin_${arch}.zip"
            ( cd ../dist && zip -q "$NAME" loomy.dylib && mv "$NAME" ../out/ )
            rm -f ../dist/loomy.dylib
          done
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          mkdir -p ../dist ../out
          VER="${GITHUB_REF_NAME#v}"; [ -n "$VER" ] || VER="0.0.0-dev"
          if [ "${{ matrix.arch }}" = "arm64" ]; then CC=aarch64-linux-gnu-gcc; else CC=gcc; fi
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} CC="$CC" \
            go build -trimpath -buildmode=c-shared -o ../dist/loomy.so .
          file ../dist/loomy.so
          NAME="${PLUGIN_ID}_${VER}_linux_${{ matrix.arch }}.zip"
          ( cd ../dist && zip -q "$NAME" loomy.so && mv "$NAME" ../out/ )
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          mkdir -p ../dist ../out
          VER="${GITHUB_REF_NAME#v}"; [ -n "$VER" ] || VER="0.0.0-dev"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -buildmode=c-shared -o ../dist/loomy.dll .
          file ../dist/loomy.dll
          NAME="${PLUGIN_ID}_${VER}_windows_amd64.zip"
          ( cd ../dist && zip -q "$NAME" loomy.dll && mv "$NAME" ../out/ )
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7

  windows-arm64:
    # mingw-w64 on Ubuntu only targets x86; windows/arm64 needs a clang that
    # speaks aarch64-w64-mingw32, which zig ships with its own libc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Toolchain (zig for aarch64-windows-gnu)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -C /tmp -xf /tmp/zig.tar.xz
          /tmp/zig-linux-x86_64-0.13.0/zig version

      - name: Build
        shell: bash
        working-directory: plugin
        run: |
          set -euo pipefail
          mkdir -p ../dist ../out
          VER="${GITHUB_REF_NAME#v}"; [ -n "$VER" ] || VER="0.0.0-dev"
          cat > ../cc-win-arm64 <<'EOF'
          #!/bin/sh
          exec /tmp/zig-linux-x86_64-0.13.0/zig cc -target aarch64-windows-gnu "$@"
          EOF
          chmod +x ../cc-win-arm64
          CGO_ENABLED=1 GOOS=windows GOARCH=arm64 CC="$PWD/../cc-win-arm64" \
            go build -trimpath -buildmode=c-shared -o ../dist/loomy.dll .
          file ../dist/loomy.dll
          NAME="${PLUGIN_ID}_${VER}_windows_arm64.zip"
          ( cd ../dist && zip -q "$NAME" loomy.dll && mv "$NAME" ../out/ )
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [darwin, linux, windows, windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
